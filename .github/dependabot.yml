version: 2
updates:
  # Web (Vue + Vite). La Raspberry Pi de Alberto usa Node 20 y npm 9: los saltos mayores que exigen
  # Node ≥ 22 o cambian la API se ignoran hasta migrarlos a mano (ver PLAN.md). Parches y menores van juntos.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # vitest 5 exige Node ≥ 22.12 (la Pi tiene Node 20; probado con Node 22 en la 3.4.0: pasa).
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # TypeScript 7 (nativo, sin API de JavaScript) aún no es compatible con vue-tsc 3.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vite 8, Pinia 4 y @vue/tsconfig 0.9 se migraron en la 3.4.0 (funcionan con Node 20.19).
      # npm-run-all2 ≥ 8 pide npm ≥ 10 (la Pi tiene npm 9).
      - dependency-name: npm-run-all2
        update-types: ['version-update:semver-major']
      # Los tipos de Node siguen la versión de Node que se usa (20/22/24), no la última.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      servidor:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
